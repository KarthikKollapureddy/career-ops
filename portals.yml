# Portal Scanner Configuration
# Customized for Java Full Stack / Backend Developers (SDE II)
# Focusing on Top Global Product-Based Companies and Fortune 100

title_filter:
  positive:
    - "Java"
    - "Backend"
    - "Back End"
    - "Back-End"
    - "Full Stack"
    - "Fullstack"
    - "Full-Stack"
    - "Java Full Stack"
    - "Java Fullstack"
    - "Java Full-Stack"
    - "SDE"
    - "SDE II"
    - "SDE 2"
    - "SDE-2"
    - "SDE-II"
    - "Software Engineer"
    - "Software Development Engineer"
    - "Spring Boot"
    - "Spring"
    - "Microservices"
    - "API"
    - "Distributed Systems"
    - "Cloud Native"
    - "AWS"
    - "Kafka"
    - "Platform Engineer"
    - "Backend Developer"
  negative:
    - "Junior"
    - "Intern"
    - "Fresher"
    - "Trainee"
    - "Graduate"
    - ".NET"
    - "Python"
    - "C++"
    - "Ruby"
    - "Staff"
    - "Principal"
    - "Director"
    - "Manager"
    - "Frontend"
    - "UI/UX"
    - "iOS"
    - "Android"
    - "Data Scientist"
  seniority_boost:
    - "Mid-Level"
    - "SDE II"
    - "SDE 2"
    - "Senior"
    - "Level 2"
    - "L4"
    - "L5"
    - "IC2"
    - "IC3"
    - "Mid-Level"
    - "SDE II"
    - "SDE 2"
    - "Senior"

search_queries:
  # General Aggregators targeting Java/Backend in India
  - name: Greenhouse — Java Backend Engineer
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Backend Engineer" OR "Java Developer" India'
    enabled: true

  - name: Workable — Full Stack Roles
    query: 'site:apply.workable.com "Full Stack" OR "SDE II" Java India'
    enabled: true

  - name: Lever — Backend SDE
    query: 'site:jobs.lever.co "Backend" OR "Java" "Software Engineer" India'
    enabled: true

tracked_companies:

